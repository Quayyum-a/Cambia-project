name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci || npm install
      - name: Run tests in demo mode
        run: |
          export USE_SUPABASE=false
          export NODE_ENV=test
          npm test
        env:
          USE_SUPABASE: false
          NODE_ENV: test
